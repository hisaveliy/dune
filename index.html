<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#181d19"><title>Dune Companion</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{color-scheme:dark;--bg:#181d19;--panel:#293029;--line:#4d5348;--text:#f2e5d1;--muted:#c6b8a5;--gold:#e8b879}*{box-sizing:border-box}body{margin:0;background:#101511;color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}#app{max-width:680px;margin:0 auto;min-height:100dvh;background:var(--bg)}header{padding:24px 18px 19px;background:radial-gradient(ellipse at 90% 0%,#86533191,transparent 70%),#30291f}header h1{font:45px Georgia,serif;letter-spacing:.07em;margin:5px 0}header h2{font:26px Georgia,serif;margin:5px 0}h2{font:25px Georgia,serif;margin:0 0 11px}h3{font:19px Georgia,serif;margin:6px 0}p{margin:9px 0}.ey{letter-spacing:.15em;font-size:10px;font-weight:800;color:var(--gold)}.muted{color:var(--muted);font-size:13px}.small{color:#bfb3a3;font-size:11px}.body{padding:17px}.top{padding:13px 17px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.button{border:1px solid #746247;background:#343a32;color:var(--text);border-radius:9px;padding:12px;text-align:center;font-weight:700;width:100%;margin:5px 0}.primary{background:var(--gold);color:#251d15;border-color:var(--gold)}.subtle{border:none;background:transparent;color:var(--gold);padding:7px}.tinybtn{background:#353b34;border:1px solid #79664c;color:var(--text);padding:7px 11px;border-radius:7px}.panel{padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:13px 0}.note{background:#393329;border-left:3px solid var(--gold);border-radius:5px;padding:11px;color:#eedcc3;font-size:13px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{background:#2b322b;color:var(--text);border:1px solid #5c5a4d;padding:12px;border-radius:9px;text-align:left}.choice.active{background:#513d2b;border-color:var(--gold)}.field{width:100%;background:#1a221c;color:var(--text);border:1px solid #786b55;border-radius:9px;padding:10px;margin:6px 0}.field::placeholder{color:#b5a999}.section{margin:17px 0 8px;color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.check{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #444a40;align-items:start}.check:last-child{border-bottom:0}.check input{width:19px;height:19px;accent-color:var(--gold);flex-shrink:0;margin-top:2px}.check span{color:var(--text)}.check .completed{text-decoration:line-through;color:#bcb6ab}.footer{padding:13px 17px 22px;background:#202720;border-top:1px solid var(--line)}.nav{display:grid;grid-template-columns:1fr 2fr;gap:9px}.track{display:flex;gap:3px;margin-top:15px}.track i{height:6px;flex:1;border-radius:4px;background:#5e5344}.track i.done{background:#a1845e}.track i.now{background:#efbd7c}.timer{font:28px ui-monospace,SFMono-Regular,monospace;color:#f3c78f;font-variant-numeric:tabular-nums;white-space:nowrap}.timerPanel{background:#373127;border:1px solid #725c41;border-radius:11px;text-align:center;padding:13px;margin:12px 0}.timers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.timers .timer{font-size:24px}.tag{color:#f5d7ac;background:#4b3827;border:1px solid #806444;border-radius:16px;padding:4px 8px;font-size:11px}.tabs{display:flex;gap:6px;overflow-x:auto;padding:9px 0}.tabs button{white-space:nowrap;border:1px solid #655c4e;color:var(--text);background:#30372f;padding:8px 11px;border-radius:8px;font-size:12px}.tabs button.active{border-color:var(--gold);background:#56402d}.metric{padding:12px;background:#2f372f;border-radius:10px}.metric b{display:block;color:var(--gold);font:21px ui-monospace,monospace}.bar{height:6px;background:#4e5046;border-radius:6px;overflow:hidden;margin:9px 0}.bar div{height:100%;background:var(--gold)}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 5px;border-bottom:1px solid #41483d}th{text-align:left;color:var(--gold)}td:last-child,th:last-child{text-align:right;font-variant-numeric:tabular-nums}.counter{display:flex;justify-content:space-between;align-items:center}.counter b{color:var(--gold);font:28px ui-monospace,monospace}.rule{border:1px solid #4b5145;background:#252c26;border-radius:10px;padding:12px;margin:8px 0}.rule strong{color:var(--gold)}.ruleslink{font-size:12px;color:var(--gold)}@media(max-width:355px){.timers .timer{font-size:19px}}
.panel strong,.panel label,.panel p,.panel span{color:inherit}.panel .completed{color:#bcb6ab}.metric b{color:var(--gold)!important}</style></head><body><div id="app"></div><script>
(()=>{'use strict';
const el=document.getElementById('app'),store='dune_companion_release_1',F=['Atreides','Harkonnen','Fremen','Emperor','Guild','Bene Gesserit','Ixians','Tleilaxu','CHOAM','Richese','Ecaz','Moritani'],N={Atreides:'Атрейдесы',Harkonnen:'Харконнены',Fremen:'Фремены',Emperor:'Император',Guild:'Гильдия','Bene Gesserit':'Бене Гессерит',Ixians:'Иксиане',Tleilaxu:'Тлейлаксу',CHOAM:'CHOAM',Richese:'Richese',Ecaz:'Ecaz',Moritani:'Moritani'},P=['Storm','Spice Blow & Nexus','CHOAM Charity','Bidding','Revival','Shipment & Movement','Battle','Spice Collection','Mentat Pause'];
const free={Atreides:2,Harkonnen:2,Fremen:3,Emperor:1,Guild:1,'Bene Gesserit':1,Ixians:1,Tleilaxu:2,CHOAM:0,Richese:2,Ecaz:2,Moritani:2};
const ability={Atreides:{1:'Предвидение при Spice Blow.',3:'Просмотр продаваемой Treachery Card.',6:'Предвидение боевого плана.'},Harkonnen:{3:'Лимит карт до 8; дополнительное получение после покупки.',6:'Traitor Cards и возможный захват лидера.'},Fremen:{0:'Storm Cards применяются с учётом раунда.',1:'Шай-Хулуд, перемещение червём, Nexus.',4:'Обычно 3 бесплатных войска; обычная платная докупка недоступна.',5:'Особая бесплатная высадка и дальность движения.',6:'Fedaykin и исключения Advanced.',8:'В конце 10-го раунда — специальная победа.'},Emperor:{3:'Получает обычные платежи аукциона.',4:'Воскрешение и помощь союзнику.',6:'Sardaukar.'},Guild:{5:'Специальные высадки, скидки, порядок хода.',8:'Победа по умолчанию в конце игры при применимых условиях.'},'Bene Gesserit':{2:'Особое Charity в Advanced.',5:'Правила Advisor и совместного присутствия.',6:'Voice и особенности сражения.',8:'Проверить тайное предсказание в момент подходящей победы.'},Ixians:{0:'Hidden Mobile Stronghold.',3:'Особые правила аукциона.',5:'Hidden Mobile Stronghold, Suboid и Cyborg.'},Tleilaxu:{4:'Особые лимиты Revival и платежи; отдельно проверьте лидеров.',6:'Face Dancers и особые эффекты.',8:'Проверить связанные с Face Dancers эффекты.'},CHOAM:{2:'До выплат получает 2 спайса за участвующую фракцию.',3:'Специальные свойства Treachery Cards.',4:'Базовое бесплатное воскрешение — 0.',8:'Inflation Token.'},Richese:{3:'Специальная продажа и вид аукциона.',5:'No-Field Tokens.'},Ecaz:{4:'Размещение Ambassador Tokens.',6:'Ambassadors и Duke Vidal.',7:'Особые правила союзного сбора спайса.',8:'При подходящем совместном контроле 3 крепостей — особая союзная победа.'},Moritani:{1:'Особые взаимодействия с червями.',5:'Terror Tokens и их эффекты.',6:'Terror Tokens и боевые исключения.'}};
let library=[];try{library=JSON.parse(localStorage.getItem(store)||'[]')}catch{}if(!Array.isArray(library))library=[];let g=null,page='home',tab='rounds',shownRound=1,prepTab='general';const copy=v=>JSON.parse(JSON.stringify(v)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({id:'g'+Date.now(),created:Date.now(),selected:['Fremen','Atreides','Ecaz','Moritani','CHOAM'],playerNames:{},advanced:true,alliances:true,modules:{discovery:true,stronghold:true,tech:true},checks:{},values:{},cursor:0,started:false,finished:false,paused:false,active:null,startedAt:null,elapsed:{},round:1,phase:0});
function persist(){if(!g)return;let i=library.findIndex(x=>x.id===g.id);if(i<0)library.push(copy(g));else library[i]=copy(g);try{localStorage.setItem(store,JSON.stringify(library))}catch{}}
function timeline(){const a=[];for(let r=1;r<=10;r++){for(let p=0;p<9;p++){if([2,4,5,7].includes(p)){for(const f of g.selected){if(p===5){a.push({r,p,f,part:'ship'});a.push({r,p,f,part:'move'})}else a.push({r,p,f,part:'main'})}}else if(p===1){a.push({r,p,part:'A'});a.push({r,p,part:'B'})}else if(p===3){a.push({r,p,part:'prepare'});a.push({r,p,part:'auction'})}else a.push({r,p,part:'main'})}a.push({r,p:9,part:'statistics'})}return a}
const current=()=>timeline()[g.cursor],key=x=>[x.r,x.p,x.f||'shared',x.part].join('|');function settle(){if(g?.active&&!g.paused&&g.startedAt){g.elapsed[g.active]=(g.elapsed[g.active]||0)+Math.max(0,Date.now()-g.startedAt);g.startedAt=Date.now()}}function activate(){let s=current();g.active=s&&s.p!==9&&!g.finished?key(s):null;g.startedAt=g.active&&!g.paused?Date.now():null}
function step(delta){settle();let next=g.cursor+delta,a=timeline();if(next<0)return;if(next>=a.length){g.finished=true;g.active=null;g.startedAt=null;page='ended'}else{g.cursor=next;let s=current();g.round=s.r;g.phase=s.p;page=s.p===9?'stats':'play';shownRound=s.r;activate()}persist();render()}
const spent=k=>(g.elapsed[k]||0)+(g.active===k&&!g.paused&&g.startedAt?Math.max(0,Date.now()-g.startedAt):0);const keys=()=>new Set([...Object.keys(g.elapsed),...(g.active?[g.active]:[])]);const phaseMs=(r,p)=>[...keys()].filter(k=>k.startsWith(r+'|'+p+'|')).reduce((a,k)=>a+spent(k),0);const roundMs=r=>P.reduce((n,_,i)=>n+phaseMs(r,i),0);const playerMs=f=>[...keys()].filter(k=>k.split('|')[2]===f).reduce((a,k)=>a+spent(k),0);const total=()=>Array.from({length:10},(_,i)=>roundMs(i+1)).reduce((a,b)=>a+b,0);const fmt=ms=>{let n=Math.floor(Math.max(0,ms)/1000);return[Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(v=>String(v).padStart(2,'0')).join(':')};
const v=(id,fallback)=>g.values[id]??fallback,c=id=>!!g.checks[id];const check=(id,txt)=>`<label class="check"><input type="checkbox" data-check="${esc(id)}" ${c(id)?'checked':''}><span class="${c(id)?'completed':''}">${txt}</span></label>`;const select=(id,opts,d)=>`<select class="field" data-value="${esc(id)}">${opts.map(([x,t])=>`<option value="${esc(x)}" ${String(v(id,d))===String(x)?'selected':''}>${esc(t)}</option>`).join('')}</select>`;const counter=(id,d,maximum)=>`<div class="counter"><button class="tinybtn" data-number="${esc(id)}" data-delta="-1">−</button><b>${v(id,d)}</b><button class="tinybtn" data-number="${esc(id)}" data-delta="1" data-max="${maximum}">+</button></div>`;const panel=(title,txt)=>`<div class="panel">${title?`<div class="section" style="margin-top:0">${title}</div>`:''}${txt}</div>`;const note=s=>`<div class="note">${s}</div>`;const extra=(f,p)=>ability[f]?.[p]?`<div class="rule"><strong>${N[f]}</strong><div class="muted">${ability[f][p]}</div>${p===8?check('r'+g.round+'-mentat-'+f,'Проверено / выполнено или неприменимо'):''}</div>`:'';const allExtra=p=>g.selected.map(f=>extra(f,p)).join('');const foot=(label,act,disabled=false)=>`<div class="footer"><button class="button primary" data-act="${act}" ${disabled?'disabled':''}>${label} →</button></div>`;
const startingSetup={"Fremen":{"spice":3,"field":10,"reserve":10,"placement":"Распределить 10 войск между Sietch Tabr, False Wall South и False Wall West.","special":"Подготовить Fedaykin (Advanced) и фракционные компоненты."},"Atreides":{"spice":10,"field":10,"reserve":10,"placement":"Разместить 10 войск в Arrakeen.","special":"В Advanced подготовить Kwisatz Haderach."},"Harkonnen":{"spice":10,"field":10,"reserve":10,"placement":"Разместить 10 войск в Carthag.","special":"Сохранить 4 Traitor Cards и получить 2 стартовые Treachery Cards."},"Emperor":{"spice":10,"field":0,"reserve":20,"placement":"Стартовых войск на поле нет; все 20 — в резерве.","special":"В Advanced подготовить 5 Sardaukar среди войск."},"Guild":{"spice":5,"field":5,"reserve":15,"placement":"Разместить 5 войск в Tuek’s Sietch.","special":"Оставить остальные 15 войск в резерве."},"Bene Gesserit":{"spice":5,"field":1,"reserve":19,"placement":"В Advanced разместить одну советницу после Фременов согласно правилам; в Basic — 1 войско в Polar Sink.","special":"Тайно записать фракцию и раунд предсказания."},"Ixians":{"spice":10,"field":6,"reserve":14,"placement":"Поставить 3 Cyborg и 3 Suboid внутрь Hidden Mobile Stronghold; сектор крепости установить после начальной бури.","special":"Подготовить оставшиеся войска и особую стартовую раздачу Treachery Cards."},"Tleilaxu":{"spice":5,"field":0,"reserve":20,"placement":"Не размещать войска в начале игры; все 20 — в резерве.","special":"Подготовить 3 Face Dancers после выбора предателей другими фракциями."},"CHOAM":{"spice":2,"field":0,"reserve":20,"placement":"Стартовых войск на поле нет; все 20 — в резерве.","special":"Подготовить Inflation Token и компоненты Auditor (Advanced)."},"Richese":{"spice":5,"field":0,"reserve":20,"placement":"Стартовых войск на поле нет; все 20 — в резерве.","special":"Подготовить 10 специальных Treachery Cards и 3 No-Field Tokens (0, 3, 5)."},"Ecaz":{"spice":12,"field":6,"reserve":14,"placement":"Разместить 6 войск в Imperial Basin.","special":"Подготовить Ambassador Tokens, Duke Vidal и исключение Loyalty/Traitor в Advanced."},"Moritani":{"spice":12,"field":6,"reserve":14,"placement":"После остальных фракций разместить 6 войск в одной незанятой территории.","special":"Подготовить скрытые Terror Tokens и Atomics Aftermath Token."}};
function setupList(){let a=[['general-board','Поле, банк спайса, фишки и ширмы подготовлены.'],['general-storm','Подготовить стартовое положение бури.'],['general-traitors','Раздать Traitor Cards с учётом исключений фракций.'],['general-treachery','Раздать стартовые Treachery Cards, включая исключения Харконненов и Иксиан.'],['general-spice','Подготовить две стопки Spice Deck.']];if(g.modules.discovery)a.push(['general-discovery','Подготовить Discovery Tokens.']);if(g.modules.stronghold)a.push(['general-strongholds','Подготовить Stronghold Cards.']);if(g.modules.tech)a.push(['general-tech','Подготовить Tech Tokens.']);for(const f of g.selected){const x=startingSetup[f];a.push([f+'-spice','Получить '+x.spice+' стартового спайса из банка.']);a.push([f+'-placement',x.placement]);a.push([f+'-reserve','Подготовить резерв: '+x.reserve+' войск (на поле: '+x.field+').']);a.push([f+'-special',x.special]);}return a}

function phaseContent(s){let base='r'+s.r+'p'+s.p,f=s.f;if(s.p===0)return panel('Storm',`<p>Переместите бурю и примените последствия, затем определите первого игрока по полю.</p>${check(base+'-storm','Буря перемещена; последствия разрешены.')}${allExtra(0)}`);
if(s.p===1){let id=base+s.part;return panel('Spice Blow · стопка '+s.part,`<p>Обрабатывайте карты последовательно до завершения стопки, в том числе повторных червей. В первом раунде действуют специальные ограничения на Nexus.</p>${select(id+'-type',[['spice','Обычный Spice Blow'],['worm','Shai-Hulud'],['great','Great Maker'],['discovery','Discovery Token'],['other','Другой / следующий эффект']],'spice')}${note('Если требуется, примените Nexus, Fremen worm ride и последствия событий, затем вернитесь к открытию карт.')}${check(id+'-done','Вся стопка обработана.')}${allExtra(1)}`)}
if(s.p===2){let id=base+f,br=v(id+'-bracket','2');return`<h2>${N[f]}</h2>${panel('Charity',`<p>Спайс игрока перед благотворительностью:</p>${select(id+'-bracket',[['0','0'],['1','1'],['2','2+']],'2')}${note('Базовая выплата: '+(br==='0'?2:br==='1'?1:0)+' спайса.'+(g.selected.includes('CHOAM')?' Плательщик — CHOAM по своим правилам.':''))}${f==='CHOAM'?note('До благотворительности CHOAM получает '+(g.selected.length*2)+' спайса.'):''}${check(id+'-done','Charity завершена.')}`)}${extra(f,2)}`}
if(s.p===3)return panel(s.part==='prepare'?'Bidding — подготовка':'Bidding — аукцион',`<p>${s.part==='prepare'?'Определите количество доступных карт и места в руках.':'Проведите торги за столом, примените платежи и права фракций.'}</p>${check(base+s.part,'Этап торгов завершён.')}${allExtra(3)}`);
if(s.p===4){let id=base+f,num=Number(v(id+'-troops',0)),limit=free[f];return`<h2>${N[f]}</h2>${panel('Revival',`<div class="grid"><div class="metric"><b>${limit}</b><span class="small">Бесплатных войск</span></div><div class="metric"><b>${f==='Fremen'?limit:3}</b><span class="small">Стандартный предел*</span></div></div><div class="section">Воскресить войск</div>${counter(id+'-troops',0,f==='Fremen'?limit:3)}${note('Базовая цена: '+(f==='Fremen'?0:Math.max(0,num-limit)*2)+' спайса. *Способности, союзники и карты могут менять расчёт. Для Фременов обычная платная докупка не предусмотрена.')}${check(id+'-leader','Лидеры, элитные войска и исключения проверены.')}${check(id+'-done','Revival завершён.')}`)}${extra(f,4)}`}
if(s.p===5){let id=base+f;if(s.part==='ship'){let n=Number(v(id+'-count',0)),dest=v(id+'-destination','hold');let cost=f==='Fremen'?'специальная бесплатная высадка':Math.ceil(n*(dest==='hold'?1:2)*(f==='Guild'?.5:1))+' спайса (базово)';return`<h2>${N[f]}</h2>${panel('Shipment',`<p>Территория высадки:</p>${select(id+'-destination',[['hold','Крепость'],['other','Другая территория']],'hold')}<div class="section">Количество войск</div>${counter(id+'-count',0,20)}${note('Цена: '+cost+'. Учитывайте специальные виды высадки, No-Field, союзников и ограничения поля.')}${check(id+'-ship','Высадка завершена или пропущена.')}`)}${extra(f,5)}`}return`<h2>${N[f]}</h2>${panel('Movement',`<p>Движение обычно бесплатно. Проверьте дальность, орнитоптеры, бурю и специальные способности.</p>${check(id+'-move','Перемещение завершено или пропущено.')}`)}${extra(f,5)}`}
if(s.p===6){let a=v(base+'-a',g.selected[0]),b=v(base+'-b',g.selected.find(f=>f!==a));return panel('Battle',`<p>Выберите две фракции. После сражения можете выбрать другую пару; таймер продолжается для всей фазы.</p>${select(base+'-a',g.selected.map(f=>[f,N[f]]),g.selected[0])}<div style="text-align:center;color:var(--gold)">VS</div>${select(base+'-b',g.selected.filter(f=>f!==a).map(f=>[f,N[f]]),g.selected.find(f=>f!==a))}${extra(a,6)}${extra(b===a?g.selected.find(f=>f!==a):b,6)}${note('Проверить Traitor, Weapon/Defense, оплату боевой силы, Karama и последствия боя. Скрытые карты вводить не требуется.')}${check(base+'-done','Все сражения завершены.')}`)}
if(s.p===7){let id=base+f,arr=c(id+'-arr'),car=c(id+'-car'),tuek=c(id+'-tuek'),rate=arr||car?3:2,n=Number(v(id+'-troops',0)),available=Number(v(id+'-available',0)),gain=Math.min(rate*n,available),income=g.advanced?(arr?2:0)+(car?2:0)+(tuek?1:0):0;return`<h2>${N[f]}</h2>${panel('Spice Collection',`<p>Расчёт для одного сектора. Доход крепостей начисляйте только один раз за фазу.</p>${check(id+'-arr','Контроль Arrakeen')}${check(id+'-car','Контроль Carthag')}${check(id+'-tuek','Контроль Tuek’s Sietch')}<div class="section">Войска в секторе</div>${counter(id+'-troops',0,20)}<div class="section">Доступный спайс</div>${counter(id+'-available',0,30)}<div class="grid"><div class="metric"><b>${gain}</b><span class="small">Собрано · ${rate} за войско</span></div><div class="metric"><b>+${income}</b><span class="small">Доход крепостей</span></div></div>${note('Сумма по одному сектору и доходу крепостей: '+(gain+income)+'. В других секторах не добавляйте доход крепостей второй раз.')}${check(id+'-done','Весь сбор спайса завершён.')}`)}${extra(f,7)}`}
if(s.p===8){let type=v(base+'-victory','none');return panel('Mentat Pause',`<p>Проверьте контроль крепостей и модули. Не объявляйте победу по одному лишь числу без проверки условий.</p>${select(base+'-victory',[['none','Обычной победы нет'],['solo','Одиночная победа'],['alliance','Победа альянса'],['ecaz','Особая союзная победа Ecaz'],['unclear','Спорная / одновременная победа']],'none')}${type!=='none'?select(base+'-winner',g.selected.map(f=>[f,N[f]]),g.selected[0]):''}${s.r===10?note('10-й раунд: проверьте специальную победу Фременов, затем Гильдии и порядок разрешения исключений.'):''}<div class="section">Проверки фракций</div>${allExtra(8)}${g.modules.discovery?check(base+'-discovery','Дополнительные крепости Discovery проверены.'):''}${g.modules.stronghold?check(base+'-strong','Stronghold Cards проверены.'):''}${g.modules.tech?check(base+'-tech','Tech Tokens проверены.'):''}${check(base+'-general','Все применимые проверки завершены.')}`)}return''}
function play(){let s=current(),personal=!!s.f;return`<header><div class="row"><span class="ey">DUNE COMPANION · GAME MASTER</span><span class="tag">${g.paused?'ПАУЗА':'● ИГРА'}</span></div><div class="row" style="margin-top:12px"><div><span class="small">РАУНД</span><h3>${s.r} / 10</h3></div><div style="text-align:right"><span class="small">ФАЗА ${s.p+1} / 9</span><h3>${P[s.p]}</h3></div></div><div class="track">${P.map((_,i)=>`<i class="${i===s.p?'now':i<s.p?'done':''}"></i>`).join('')}</div></header><div class="body"><div class="row"><span class="ey">${personal?'ХОД ИГРОКА':s.part==='A'||s.part==='B'?'СТОПКА '+s.part:'ОБЩАЯ ФАЗА'}</span><button class="tinybtn" data-action="pause">${g.paused?'▶ Продолжить':'Ⅱ Пауза'}</button></div>${personal?`<h2 style="margin-top:10px">${N[s.f]}</h2><div class="muted">${esc(g.playerNames[s.f]||'')} ${s.part==='ship'?'· Shipment':s.part==='move'?'· Movement':''}</div>`:''}<div class="${personal?'timers':''}">${personal?`<div class="timerPanel"><div class="small">ВРЕМЯ ФАЗЫ</div><div class="timer" data-clock="phase">${fmt(phaseMs(s.r,s.p))}</div></div>`:''}<div class="timerPanel"><div class="small">${personal?'ВРЕМЯ ИГРОКА':'ВРЕМЯ ФАЗЫ'}</div><div class="timer" data-clock="step">${fmt(personal?spent(key(s)):phaseMs(s.r,s.p))}</div><div class="small">${g.paused?'Остановлен':'● Активен'}</div></div></div>${phaseContent(s)}<button class="subtle" data-action="home">Главная · сохранить прогресс</button></div><div class="footer"><div class="nav"><button class="button" data-action="back" ${g.cursor===0?'disabled':''}>← Назад</button><button class="button primary" data-action="next">${s.p===8?'Статистика раунда':'Далее'} →</button></div></div>`}
function statistics(){let r=current().r,rounds=Array.from({length:r},(_,i)=>i+1),max=Math.max(...rounds.map(roundMs),1);return`<header><div class="ey">DUNE COMPANION · STATISTICS</div><h2 style="margin:6px 0">Итоги раунда ${r}</h2><div class="muted">Просмотр статистики не увеличивает игровое время.</div></header><div class="body"><div class="grid"><div class="metric"><span class="small">Вся партия</span><b>${fmt(total())}</b></div><div class="metric"><span class="small">Раунд ${r}</span><b>${fmt(roundMs(r))}</b></div></div><div class="tabs">${[['rounds','Раунды'],['phases','Фазы'],['players','Игроки']].map(([id,l])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${l}</button>`).join('')}</div>${tab==='rounds'?rounds.map(n=>`<div class="panel"><div class="row"><strong>Раунд ${n}</strong><span>${fmt(roundMs(n))}</span></div><div class="bar"><div style="width:${100*roundMs(n)/max}%"></div></div></div>`).join(''):tab==='phases'?`${select('stats-round',rounds.map(n=>[n,'Раунд '+n]),r)}<table><thead><tr><th>Фаза</th><th>Время</th></tr></thead><tbody>${P.map((p,i)=>`<tr><td>${p}</td><td>${fmt(phaseMs(Number(v('stats-round',r)),i))}</td></tr>`).join('')}</tbody></table>`:`<table><thead><tr><th>Игрок</th><th>Время</th></tr></thead><tbody>${g.selected.map(f=>`<tr><td>${esc(g.playerNames[f]||N[f])}</td><td>${fmt(playerMs(f))}</td></tr>`).join('')}</tbody></table>${note('Общие фазы не входят в персональную статистику игроков.')}`}${note('Возвращение на предыдущий шаг возобновляет его секундомер без обнуления.')}</div><div class="footer"><div class="nav"><button class="button" data-action="back">← Mentat</button><button class="button primary" data-action="next">${r===10?'Итог партии':'Раунд '+(r+1)} →</button></div></div>`}
function render(){if(page==='home')el.innerHTML=`<header><div class="ey">THE SPICE MUST FLOW</div><h1>DUNE</h1><div class="ey">COMPANION · PLAYABLE BUILD</div><p style="color:#ead2b5">Цифровой ведущий для Арракиса</p></header><div class="body"><button class="button primary" data-action="new">＋ Создать партию</button><button class="button" data-action="saved">Продолжить · ${library.length}</button>${note('Автосохранение · 12 фракций · Advanced · 9 фаз · секундомеры · статистика. Работа без интернета после загрузки.')}</div>`;
else if(page==='saved')el.innerHTML=`<div class="top"><button class="subtle" data-action="home">← Главная</button><strong>Сохранённые партии</strong></div><div class="body">${library.length?[...library].sort((a,b)=>b.created-a.created).map(z=>`<button class="button" style="text-align:left" data-load="${z.id}">${new Date(z.created).toLocaleString('ru-RU')}<div class="muted">${z.selected.map(f=>N[f]).join(' · ')}</div><span class="small">${z.finished?'Завершена':z.started?'Раунд '+z.round:'Подготовка'}</span></button>`).join(''):'<p>Пока нет сохранённых игр.</p>'}</div>`;
else if(page==='create')el.innerHTML=`<div class="top"><button class="subtle" data-action="home">← Главная</button><strong>Создание игры</strong></div><div class="body"><h2>Выбор домов</h2><p class="muted">От 2 до 6 фракций.</p><div class="grid">${F.map(f=>`<button class="choice ${g.selected.includes(f)?'active':''}" data-faction="${f}">${N[f]} ${g.selected.includes(f)?'✓':''}</button>`).join('')}</div><div class="section">Порядок хода</div>${g.selected.map((f,i)=>`<div class="panel"><div class="row"><strong>${i+1}. ${N[f]}</strong><div><button class="tinybtn" data-order="${i}" data-shift="-1" ${i===0?'disabled':''}>↑</button> <button class="tinybtn" data-order="${i}" data-shift="1" ${i===g.selected.length-1?'disabled':''}>↓</button></div></div><input class="field" data-player="${f}" placeholder="Имя игрока (необязательно)" value="${esc(g.playerNames[f]||'')}"></div>`).join('')}</div>${foot('Настройки','settings')}`;
else if(page==='settings')el.innerHTML=`<div class="top"><button class="subtle" data-action="create">← Назад</button><strong>Настройки</strong></div><div class="body"><h2>Правила партии</h2>${check('advanced','Advanced Rules')}${check('alliances','Альянсы')}<div class="section">Модули</div>${['discovery','stronghold','tech'].map(n=>check('module-'+n,({discovery:'Discovery Tokens',stronghold:'Stronghold Cards',tech:'Tech Tokens'})[n])).join('')}${note('Время не ограничивается: секундомеры отсчитывают продолжительность фаз и отдельных ходов.')}</div>${foot('Подготовка','setup')}`;
else if(page==='setup'){let a=setupList(),done=a.filter(t=>c(t[0])).length,rows=a.filter(t=>prepTab==='general'?t[0].startsWith('general-'):t[0].startsWith(prepTab+'-'));el.innerHTML=`<div class="top"><button class="subtle" data-action="settings">← Назад</button><strong>Preparation</strong></div><div class="body"><h2>Подготовка</h2><div class="muted">Готово ${done} / ${a.length}</div><div class="bar"><div style="width:${100*done/a.length}%"></div></div><div class="tabs">${[['general','Общая'],...g.selected.map(f=>[f,N[f]])].map(([id,l])=>`<button class="${prepTab===id?'active':''}" data-prep="${id}">${l}</button>`).join('')}</div>${prepTab==='general'?'':`<div class="grid"><div class="metric"><span class="small">Стартовый спайс</span><b>${startingSetup[prepTab].spice}</b></div><div class="metric"><span class="small">На поле / резерв</span><b>${startingSetup[prepTab].field} / ${startingSetup[prepTab].reserve}</b></div></div>`}${panel(prepTab==='general'?'Общая подготовка':N[prepTab],rows.map(t=>check(...t)).join(''))}${note('Числа и формулировки основаны на рабочей матрице подготовки; особые условия и исключения сверяйте с официальными правилами перед партией.')}</div>${foot('Начать игру','start',done!==a.length)}`}
else if(page==='play')el.innerHTML=play();else if(page==='stats')el.innerHTML=statistics();else if(page==='ended')el.innerHTML=`<header><div class="ey">THE SPICE MUST FLOW</div><h2>Партия завершена</h2><div class="timer">${fmt(total())}</div></header><div class="body"><div class="section">Личное время за партию</div>${g.selected.map(f=>`<div class="panel row"><strong>${N[f]}</strong><span>${fmt(playerMs(f))}</span></div>`).join('')}${note('Проверьте окончательный результат и особые победные условия на поле.') }<button class="button" data-action="back">← Итоги раунда</button><button class="button primary" data-action="home">На главную</button></div>`;updateClocks()}
function updateClocks(){if(page!=='play'||!g)return;let s=current(),a=el.querySelector('[data-clock=step]'),b=el.querySelector('[data-clock=phase]');if(a)a.textContent=fmt(s.f?spent(key(s)):phaseMs(s.r,s.p));if(b)b.textContent=fmt(phaseMs(s.r,s.p))}
el.addEventListener('click',evt=>{let b=evt.target.closest('button');if(!b)return;if(b.dataset.faction){let f=b.dataset.faction,i=g.selected.indexOf(f);if(i>=0&&g.selected.length>2)g.selected.splice(i,1);else if(i<0&&g.selected.length<6)g.selected.push(f);persist();render();return}if(b.dataset.order!==undefined){let i=+b.dataset.order,j=i+(+b.dataset.shift);if(j>=0&&j<g.selected.length)[g.selected[i],g.selected[j]]=[g.selected[j],g.selected[i]];persist();render();return}if(b.dataset.prep){prepTab=b.dataset.prep;render();return}if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.load){g=copy(library.find(z=>z.id===b.dataset.load));if(g.started&&!g.finished){page=current().p===9?'stats':'play';activate()}else page=g.finished?'ended':'setup';persist();render();return}if(b.dataset.number){let k=b.dataset.number;g.values[k]=Math.min(Number(b.dataset.max||100),Math.max(0,Number(v(k,0))+Number(b.dataset.delta)));persist();render();return}switch(b.dataset.action){case'new':g=fresh();prepTab='general';page='create';persist();render();break;case'saved':page='saved';render();break;case'home':settle();if(g&&g.active){g.paused=true;g.startedAt=null}persist();page='home';render();break;case'create':page='create';render();break;case'settings':page='settings';g.checks.advanced=g.advanced;g.checks.alliances=g.alliances;for(let k of Object.keys(g.modules))g.checks['module-'+k]=g.modules[k];render();break;case'setup':page='setup';render();break;case'start':g.started=true;g.cursor=0;g.paused=false;page='play';activate();persist();render();break;case'next':step(1);break;case'back':step(-1);break;case'pause':settle();g.paused=!g.paused;g.startedAt=g.paused?null:Date.now();persist();render();break;}});
el.addEventListener('change',evt=>{let x=evt.target;if(!g)return;if(x.dataset.check){g.checks[x.dataset.check]=x.checked;if(x.dataset.check==='advanced')g.advanced=x.checked;if(x.dataset.check==='alliances')g.alliances=x.checked;if(x.dataset.check.startsWith('module-'))g.modules[x.dataset.check.slice(7)]=x.checked;persist();render();return}if(x.dataset.value){g.values[x.dataset.value]=x.value;persist();render();return}if(x.dataset.player){g.playerNames[x.dataset.player]=x.value;persist();}});el.addEventListener('input',evt=>{let x=evt.target;if(g&&x.dataset.player){g.playerNames[x.dataset.player]=x.value;persist()}});
setInterval(()=>{if(g&&g.started&&!g.paused&&g.active){settle();persist()}updateClocks()},1000);render();
})();
</script><script>if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script></body></html>
